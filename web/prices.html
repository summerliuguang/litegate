<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>模型价格 - LiteGate</title>
<link rel="stylesheet" href="/static/vendor/bulma.min.css">
<script src="/static/theme.js"></script>
<link rel="stylesheet" href="/static/skin.css">
<link rel="stylesheet" href="/static/admin.css">
</head>
<body data-page="prices">
<div class="wrap">
  <h1 class="title is-4" style="margin:0 0 .3rem">模型价格</h1>
  <p class="is-size-7 has-text-grey" style="margin-bottom:1rem">
    单位：/ 百万 token，币种跟随各模型官方定价页（<b>$</b> 美元 / <b>¥</b> 人民币），不做汇率换算；
    成本按各行币种数值直接累计。缓存命中价留空时自动按输入（未命中）价 1/10 计。
    配置空闲折扣（如 DeepSeek 的 0.5）时，存储价视为高峰全价，北京时间周一至周五 9-12/14-18 之外按折扣计。
    未配置价格的模型不计成本（记 0）。
    价格匹配先精确、再最长前缀：<code>gpt-4o</code> 覆盖 <code>gpt-4o-2024-08-06</code>。
  </p>

  <div style="margin-bottom:1.2rem;display:flex;justify-content:flex-end">
    <button class="button is-link is-small" id="btnNew" type="button">＋ 新建模型价格</button>
  </div>

  <form class="card" style="margin-bottom:1.2rem;display:none" id="formUp">
    <div class="card-content">
      <div class="columns is-multiline">
        <div class="column is-one-third">
          <label class="label is-size-7">模型名（支持 <code>模型名前缀</code> 写法匹配一族）</label>
          <input class="input is-small mono" id="fModel" placeholder="gpt-4o" required>
        </div>
        <div class="column is-narrow">
          <label class="label is-size-7">币种</label>
          <div class="select is-small">
            <select id="fCurrency">
              <option value="USD" selected>$ 美元</option>
              <option value="CNY">¥ 人民币</option>
            </select>
          </div>
        </div>
        <div class="column"><label class="label is-size-7">输入(未命中) /M</label>
          <input class="input is-small" id="fIn" type="number" min="0" step="any" placeholder="2.5" required></div>
        <div class="column"><label class="label is-size-7">输入(命中) /M</label>
          <input class="input is-small" id="fCache" type="number" min="0" step="any" placeholder="留空=自动 1/10"></div>
        <div class="column"><label class="label is-size-7">输出 /M</label>
          <input class="input is-small" id="fOut" type="number" min="0" step="any" placeholder="10" required></div>
        <div class="column is-narrow"><label class="label is-size-7">空闲折扣</label>
          <input class="input is-small" id="fOff" type="number" min="0" max="1" step="any" placeholder="1=不分时段" style="width:8.5rem"></div>
        <div class="column is-narrow" style="display:flex;align-items:flex-end">
          <button class="button is-link is-small" type="submit">保存（新建或覆盖）</button>
        </div>
      </div>
    </div>
  </form>

  <div class="table-container card">
    <table class="table is-fullwidth is-size-7 mobile-cards" style="border-radius:12px">
      <thead><tr><th>模型</th><th>输入(未命中) /M</th><th>输入(命中) /M</th><th>输出 /M</th><th>空闲折扣</th><th>更新时间</th><th style="min-width:90px">操作</th></tr></thead>
      <tbody id="rows"><tr><td colspan="7" class="has-text-grey">加载中…</td></tr></tbody>
    </table>
  </div>

  <div id="freeBox" style="margin-top:1.2rem"></div>
</div>
<script src="/static/common.js"></script>
<script>
'use strict';
renderNav();

// 模型名可能含 "/"，DELETE 走通配路由 /prices/{model...}
function delUrl(model) { return '/api/admin/prices/' + model.split('/').map(encodeURIComponent).join('/'); }

const CUR_SYMBOL = { USD: '$', CNY: '¥' };
function curSym(c) { return CUR_SYMBOL[(c || 'USD').toUpperCase()] || (c || 'USD'); }

const isFree = p => +p.input_price === 0 && +p.output_price === 0;

// 新建价格表单：默认收起，点「新建模型价格」展开，保存成功后收起
const formUp = document.getElementById('formUp');
const btnNew = document.getElementById('btnNew');
function setFormOpen(open) {
  formUp.style.display = open ? '' : 'none';
  btnNew.textContent = open ? '收起' : '＋ 新建模型价格';
  if (open) document.getElementById('fModel').focus();
}
btnNew.addEventListener('click', () => setFormOpen(formUp.style.display === 'none'));

async function load() {
  try {
    const prices = await api('/api/admin/prices');
    const tb = document.getElementById('rows');
    const box = document.getElementById('freeBox');
    const paid = prices.filter(p => !isFree(p));
    const free = prices.filter(isFree);
    if (!prices.length) {
      tb.innerHTML = '<tr><td colspan="7" class="has-text-grey">还没有价格配置，点右上角「新建模型价格」添加</td></tr>';
      box.innerHTML = '';
      return;
    }
    tb.innerHTML = paid.map(p => {
      const s = curSym(p.currency);
      const hit = p.cache_read_price > 0 ? `${s}${p.cache_read_price}` : `自动（${s}${(p.input_price * 0.1).toFixed(2).replace(/\.?0+$/, '')}）`;
      const off = p.offpeak_ratio && p.offpeak_ratio < 1 ? `×${p.offpeak_ratio}` : '—';
      return `<tr>
      <td data-label="模型" class="mono cell-col"><b>${esc(p.model)}</b></td>
      <td data-label="输入(未命中) /M">${s}${p.input_price}</td>
      <td data-label="输入(命中) /M">${hit}</td>
      <td data-label="输出 /M">${s}${p.output_price}</td>
      <td data-label="空闲折扣">${esc(off)}</td>
      <td data-label="更新时间" class="mono">${fmtTs(p.updated_at)}</td>
      <td data-label="操作"><button class="button is-small is-danger is-light" onclick="delPrice('${esc(p.model)}')">删除</button></td>
    </tr>`;
    }).join('') || '<tr><td colspan="7" class="has-text-grey">暂无计费模型</td></tr>';
    // 免费模型（0/0）不值得一行表格，聚合成一张卡片，一行一条
    box.innerHTML = free.length ? `
      <div class="card" style="margin-top:1.2rem"><div class="card-content" style="padding:.85rem 1rem">
        <h2 class="title is-6" style="margin:0 0 .35rem">免费模型
          <span class="is-size-7 has-text-grey" style="font-weight:400">（${free.length} 个，不计成本）</span></h2>
        ${free.map(p =>
          `<div class="free-row"><span class="mono">${esc(p.model)}</span>` +
          `<button class="button is-small is-danger is-light" onclick="delPrice('${esc(p.model)}')">删除</button></div>`).join('')}
      </div></div>` : '';
  } catch (ex) { toast('加载失败：' + ex.message, false); }
}

document.getElementById('formUp').addEventListener('submit', async e => {
  e.preventDefault();
  const body = {
    model: document.getElementById('fModel').value.trim(),
    currency: document.getElementById('fCurrency').value,
    input_price: parseFloat(document.getElementById('fIn').value),
    cache_read_price: parseFloat(document.getElementById('fCache').value) || 0,
    output_price: parseFloat(document.getElementById('fOut').value),
    offpeak_ratio: parseFloat(document.getElementById('fOff').value) || 0,
  };
  if (!body.model || isNaN(body.input_price) || isNaN(body.output_price)) return;
  try {
    await api('/api/admin/prices', { method: 'PUT', body: JSON.stringify(body) });
    toast('已保存：' + body.model);
    setFormOpen(false);
    load();
  } catch (ex) { toast('保存失败：' + ex.message, false); }
});

window.delPrice = async function (model) {
  if (!confirm(`确定删除「${model}」的价格配置？`)) return;
  try { await api(delUrl(model), { method: 'DELETE' }); toast('已删除'); load(); }
  catch (ex) { toast('删除失败：' + ex.message, false); }
};

load();
</script>
</body>
</html>
