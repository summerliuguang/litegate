<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>虚拟密钥 - LiteGate</title>
<link rel="stylesheet" href="/static/vendor/bulma.min.css">
<script src="/static/theme.js"></script>
<link rel="stylesheet" href="/static/skin.css">
<link rel="stylesheet" href="/static/admin.css">
</head>
<body data-page="keys">
<div class="wrap">
  <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.5rem;margin-bottom:1rem">
    <h1 class="title is-4" style="margin:0;white-space:nowrap">虚拟密钥</h1>
    <form class="field has-addons" style="margin:0" id="formNew">
      <input class="input is-small" id="fName" placeholder="密钥名称，如 my-claude" style="width:200px" required>
      <button class="button is-link is-small" type="submit">＋ 签发</button>
    </form>
  </div>
  <p class="is-size-7 has-text-grey" style="margin-bottom:.8rem">
    下游客户端用虚拟密钥访问网关（上游真实密钥保存在渠道里，不会暴露）。OpenAI 协议用 <code>Authorization: Bearer</code>，Anthropic 协议用 <code>x-api-key</code>，Base URL 填 <code class="mono" id="baseHint"></code>。
  </p>
  <div class="table-container card">
    <table class="table is-fullwidth is-size-7 mobile-cards" style="border-radius:12px">
      <thead><tr><th>ID</th><th>名称</th><th>密钥</th><th>模型限制</th><th>限额 / 预算 / 有效期</th><th>输出速度（7 天）</th><th>创建时间</th><th style="min-width:220px">操作</th></tr></thead>
      <tbody id="rows"><tr><td colspan="8" class="has-text-grey">加载中…</td></tr></tbody>
    </table>
  </div>
</div>

<!-- 编辑密钥模态框 -->
<div class="modal" id="editModal">
  <div class="modal-background"></div>
  <div class="modal-card">
    <header class="modal-card-head"><p class="modal-card-title">编辑密钥</p>
      <button class="delete" id="eClose" aria-label="close"></button></header>
    <section class="modal-card-body">
      <div class="field"><label class="label is-size-7">名称</label>
        <input class="input is-small" id="eName"></div>
      <div class="field">
        <label class="label is-size-7">允许的模型（下拉勾选，多选；留空 = 不限制，可用全部启用模型）</label>
        <button class="button is-small is-fullwidth" type="button" id="ddToggle" style="justify-content:space-between">
          <span id="ddLabel">全部模型（不限制）</span>
          <span class="has-text-grey">▾</span>
        </button>
        <div id="ddPanel" style="display:none;border:1px solid var(--line,#e8eaf0);border-radius:8px;margin-top:.4rem;background:#fff">
          <div style="padding:.45rem .6rem;border-bottom:1px solid var(--line,#e8eaf0);position:sticky;top:0;background:#fff">
            <input class="input is-small mono" id="ddFilter" placeholder="搜索模型…">
            <div class="is-flex" style="gap:.4rem;margin-top:.35rem;align-items:center">
              <button class="button is-small" type="button" id="ddAll">勾选可见</button>
              <button class="button is-small" type="button" id="ddNone">清空</button>
              <span class="is-size-7 has-text-grey" id="ddCount"></span>
            </div>
          </div>
          <div id="ddList" style="max-height:260px;overflow-y:auto;padding:.3rem .6rem .5rem"></div>
        </div>
        <p class="help is-size-7 has-text-grey">只列出各渠道当前启用的模型；渠道新增模型后需回到这里重新勾选</p>
      </div>
      <div class="field">
        <label class="label is-size-7">Auto 自动路由（客户端 model 填 "auto" 时按策略自动选模型）</label>
        <div class="control select is-small is-fullwidth"><select id="eAutoMode">
          <option value="">关闭（只能调用指定模型）</option>
          <option value="latency">低延迟 —— 近 24h 实测最快的候选</option>
          <option value="balance">负载均衡 —— 候选池轮转均摊</option>
          <option value="priority">自定义优先级 —— 按顺序，首选不可用自动降级</option>
          <option value="smart">任务智能分配 —— 按图片/工具/输入长度选档</option>
        </select></div>
        <div id="autoModelsBox" style="display:none;margin-top:.5rem">
          <label class="label is-size-7">候选模型池（下拉勾选；留空 = 跟随“允许的模型”，两者都空 = 全部启用模型）</label>
          <button class="button is-small is-fullwidth" type="button" id="adToggle" style="justify-content:space-between">
            <span id="adLabel">跟随允许的模型</span><span class="has-text-grey">▾</span>
          </button>
          <div id="adPanel" style="display:none;border:1px solid var(--line,#e8eaf0);border-radius:8px;margin-top:.4rem;background:#fff">
            <div style="padding:.45rem .6rem;border-bottom:1px solid var(--line,#e8eaf0);position:sticky;top:0;background:#fff">
              <input class="input is-small mono" id="adFilter" placeholder="搜索模型…">
              <div class="is-flex" style="gap:.4rem;margin-top:.35rem;align-items:center">
                <button class="button is-small" type="button" id="adAll">勾选可见</button>
                <button class="button is-small" type="button" id="adNone">清空</button>
                <span class="is-size-7 has-text-grey" id="adCount"></span>
              </div>
            </div>
            <div id="adList" style="max-height:220px;overflow-y:auto;padding:.3rem .6rem .5rem"></div>
          </div>
        </div>
        <div id="autoPrioBox" style="display:none;margin-top:.5rem">
          <label class="label is-size-7">优先级顺序（从上到下依次尝试；未列出的候选追加在末尾）</label>
          <div id="prioList"></div>
          <button class="button is-small" type="button" id="prioRebuild" style="margin-top:.3rem">按候选池勾选顺序重建</button>
        </div>
        <p class="help is-size-7 has-text-grey">auto 解析后的真实模型照常计入日志/限流/成本；候选须为渠道当前启用的模型</p>
      </div>
      <div class="columns" style="margin-bottom:0">
        <div class="column"><div class="field"><label class="label is-size-7">RPM 限速（次/分钟，0 = 不限）</label>
          <input class="input is-small" id="eRpm" type="number" min="0" value="0"></div></div>
        <div class="column"><div class="field"><label class="label is-size-7">TPM 限速（token/分钟，0 = 不限）</label>
          <input class="input is-small" id="eTpm" type="number" min="0" value="0"></div></div>
      </div>
      <div class="columns" style="margin-bottom:0">
        <div class="column"><div class="field"><label class="label is-size-7">预算（美元，0 = 不限）</label>
          <input class="input is-small" id="eBudget" type="number" min="0" step="0.01" value="0"></div></div>
        <div class="column"><div class="field"><label class="label is-size-7">Token 预算（0 = 不限）</label>
          <input class="input is-small" id="eBudgetTok" type="number" min="0" value="0"></div></div>
        <div class="column"><div class="field"><label class="label is-size-7">预算周期</label>
          <div class="control select is-small is-fullwidth"><select id="eBudgetPeriod">
            <option value="daily">每日</option>
            <option value="monthly">每月</option>
          </select></div></div>
      </div>
      <div class="field"><label class="label is-size-7">有效期至（留空 = 永久；过期后该密钥返回 401）</label>
        <input class="input is-small" id="eExpires" type="date"></div>
      <p id="eErr" class="help is-danger" style="min-height:1.2em"></p>
    </section>
    <footer class="modal-card-foot">
      <button class="button is-link" id="eSave">保存</button>
      <button class="button" id="eCancel">取消</button>
    </footer>
  </div>
</div>
<script src="/static/common.js"></script>
<script>
'use strict';
renderNav();
document.getElementById('baseHint').textContent = location.origin;

async function load() {
  try {
    const keys = keysCache = await api('/api/admin/keys');
    const tb = document.getElementById('rows');
    if (!keys.length) {
      tb.innerHTML = '<tr><td colspan="8" class="has-text-grey">还没有密钥，上方输入名称签发一个</td></tr>';
      return;
    }
    tb.innerHTML = keys.map(k => {
      const am = k.allowed_models || [];
      const autoTag = k.auto_mode
        ? `<span class="tag is-warning is-light is-size-7" style="margin:0 .2rem .2rem 0"
             title="auto 路由：${AUTO_MODE_LABEL[k.auto_mode] || k.auto_mode}">auto · ${AUTO_MODE_LABEL[k.auto_mode] || esc(k.auto_mode)}</span>`
        : '';
      const lim = am.length
        ? autoTag + am.slice(0, 3).map(m => `<span class="tag is-link is-light is-size-7" style="margin:0 .2rem .2rem 0">${esc(m)}</span>`).join('')
          + (am.length > 3 ? `<span class="tag is-light is-size-7" title="${esc(am.join('\n'))}">+${am.length - 3}</span>` : '')
        : autoTag || '<span class="has-text-grey">全部模型</span>';
      const limits = [];
      if (k.rpm_limit) limits.push(k.rpm_limit + ' RPM');
      if (k.tpm_limit) limits.push(k.tpm_limit + ' TPM');
      if (k.budget_usd) limits.push('$' + k.budget_usd + '/' + (k.budget_period === 'monthly' ? '月' : '日'));
      if (k.budget_tokens) limits.push(k.budget_tokens.toLocaleString() + ' tok/' + (k.budget_period === 'monthly' ? '月' : '日'));
      if (k.expires_at) limits.push('至 ' + k.expires_at);
      const tps = k.avg_tps ? k.avg_tps.toFixed(1) + ' tok/s' : '';
      const tpsCell = tps
        ? `<span title="近 7 天成功请求 ${fmtInt(k.recent_requests)} 次的加权平均">${esc(tps)}</span>`
        : '<span class="has-text-grey">--</span>';
      return `<tr>
      <td data-label="ID">${k.id}</td>
      <td data-label="名称"><b>${esc(k.name)}</b></td>
      <td data-label="密钥" class="mono cell-col" data-keycell="${k.id}" data-shown="0">${esc(k.key)}</td>
      <td data-label="模型限制" class="cell-col">${lim}</td>
      <td data-label="限额" class="cell-col">${limits.length ? esc(limits.join('，')) : '<span class="has-text-grey">不限</span>'}</td>
      <td data-label="输出速度" class="mono">${tpsCell}</td>
      <td data-label="创建时间" class="mono">${fmtTs(k.created_at)}</td>
      <td data-label="操作" class="cell-col">
        <button class="button is-small" onclick="toggleKey(${k.id})">显示</button>
        <button class="button is-small" onclick="copyKey(${k.id})">复制</button>
        <button class="button is-small" onclick="openEditKey(${k.id})">编辑</button>
        <button class="button is-small is-danger is-light" onclick="delKey(${k.id}, '${esc(k.name)}')">删除</button>
      </td>
    </tr>`;
    }).join('');
  } catch (ex) { toast('加载失败：' + ex.message, false); }
}

document.getElementById('formNew').addEventListener('submit', async e => {
  e.preventDefault();
  const name = document.getElementById('fName').value.trim();
  if (!name) return;
  try {
    const k = await api('/api/admin/keys', { method: 'POST', body: JSON.stringify({ name }) });
    document.getElementById('fName').value = '';
    toast('已签发：' + k.key);
    load();
  } catch (ex) { toast('签发失败：' + ex.message, false); }
});

window.delKey = async function (id, name) {
  if (!confirm(`确定删除密钥「${name}」？使用它的客户端将立即失去访问权限。`)) return;
  try { await api('/api/admin/keys/' + id, { method: 'DELETE' }); toast('已删除'); load(); }
  catch (ex) { toast('删除失败：' + ex.message, false); }
};

// ---- 密钥显示/复制（明文按需获取，列表默认打码） ----
const revealed = {};
async function revealKey(id) {
  if (!revealed[id]) {
    const r = await api(`/api/admin/keys/${id}/reveal`);
    revealed[id] = r.key;
  }
  return revealed[id];
}
window.toggleKey = async function (id) {
  const cell = document.querySelector(`[data-keycell="${id}"]`);
  const k = keysCache.find(x => x.id === id);
  if (cell.dataset.shown === '1') {
    cell.textContent = k.key;
    cell.dataset.shown = '0';
  } else {
    cell.textContent = await revealKey(id);
    cell.dataset.shown = '1';
  }
  // 更新按钮文案
  const btn = cell.closest('tr').querySelector('button[onclick^="toggleKey"]');
  btn.textContent = cell.dataset.shown === '1' ? '隐藏' : '显示';
};
window.copyKey = async function (id) {
  copyText(await revealKey(id));
};

// ---- 编辑密钥 ----
let keysCache = [];
let editingKeyId = null;
let enabledModels = [];         // 各渠道启用模型的并集（disabled 的不出现）
let selectedModels = new Set(); // 编辑中的“允许的模型”已勾选集合
let autoPoolSel = new Set();    // 编辑中的 auto 候选池已勾选集合
let autoPriority = [];          // auto 优先级顺序（priority 模式）

const AUTO_MODE_LABEL = { latency: '低延迟', balance: '负载均衡', priority: '优先级', smart: '智能分配' };

// mkDropdown 把“下拉勾选多选”封装成可复用组件：两个实例分别绑定
// “允许的模型”与 auto 候选池；set 为各自的已选集合，emptyText 是未选时的标签文案。
function mkDropdown(ids, set, emptyText) {
  const $ = id => document.getElementById(id);
  let bound = false;
  function refreshLabel() {
    const n = set.size;
    $(ids.label).textContent = n ? `已选 ${n} 个模型` : emptyText;
  }
  function render(filter) {
    const kw = (filter || '').toLowerCase();
    const rows = enabledModels.filter(m => !kw || m.toLowerCase().includes(kw));
    // 已勾选但渠道已停用的模型：灰显保留，避免保存时静默丢失
    const stale = [...set].filter(m => !enabledModels.includes(m));
    let html = rows.map(m =>
      `<label style="display:flex;gap:.5rem;align-items:center;padding:.16rem 0;cursor:pointer">
         <input type="checkbox" class="${ids.cls}" data-model="${esc(m)}" ${set.has(m) ? 'checked' : ''}>
         <span class="mono" style="word-break:break-all">${esc(m)}</span>
       </label>`).join('');
    if (stale.length) {
      html += `<p class="is-size-7 has-text-grey" style="margin:.4rem 0 .1rem">已勾选但渠道当前未启用（保存后保留）：</p>` +
        stale.map(m =>
          `<label style="display:flex;gap:.5rem;align-items:center;padding:.16rem 0;cursor:pointer;opacity:.55">
             <input type="checkbox" class="${ids.cls}" data-model="${esc(m)}" checked>
             <span class="mono">${esc(m)}</span>
           </label>`).join('');
    }
    $(ids.list).innerHTML = html || '<p class="has-text-grey is-size-7">没有匹配的启用模型</p>';
    $(ids.count).textContent =
      `已选 ${set.size} / 共 ${enabledModels.length}` + (kw ? `（匹配 ${rows.length}）` : '');
  }
  function bind() {
    if (bound) return;
    bound = true;
    const panel = $(ids.panel);
    $(ids.toggle).addEventListener('click', e => {
      e.stopPropagation();
      const open = panel.style.display !== 'none';
      panel.style.display = open ? 'none' : 'block';
      if (!open) render($(ids.filter).value);
    });
    document.addEventListener('click', e => {
      if (panel.style.display !== 'none' && !panel.contains(e.target)) panel.style.display = 'none';
    });
    $(ids.filter).addEventListener('click', e => e.stopPropagation());
    $(ids.filter).addEventListener('input', e => render(e.target.value));
    $(ids.list).addEventListener('change', e => {
      const cb = e.target.closest('.' + ids.cls);
      if (!cb) return;
      if (cb.checked) set.add(cb.dataset.model);
      else set.delete(cb.dataset.model);
      refreshLabel();
      onPoolChanged(cb.dataset.model, cb.checked); // auto 候选池变化联动优先级列表
    });
    $(ids.all).addEventListener('click', () => {
      const kw = $(ids.filter).value.toLowerCase();
      enabledModels.filter(m => !kw || m.toLowerCase().includes(kw)).forEach(m => set.add(m));
      render($(ids.filter).value);
      refreshLabel();
      onPoolChanged(null, true);
    });
    $(ids.none).addEventListener('click', () => {
      set.clear();
      render($(ids.filter).value);
      refreshLabel();
      onPoolChanged(null, false);
    });
  }
  return { render, refreshLabel, bind };
}

const ddAllowed = mkDropdown(
  { toggle: 'ddToggle', label: 'ddLabel', panel: 'ddPanel', filter: 'ddFilter',
    list: 'ddList', all: 'ddAll', none: 'ddNone', count: 'ddCount', cls: 'dd-check' },
  selectedModels, '全部模型（不限制）');
const ddAuto = mkDropdown(
  { toggle: 'adToggle', label: 'adLabel', panel: 'adPanel', filter: 'adFilter',
    list: 'adList', all: 'adAll', none: 'adNone', count: 'adCount', cls: 'ad-check' },
  autoPoolSel, '跟随允许的模型（两者都空 = 全部启用）');

// onPoolChanged 候选池勾选联动优先级列表：勾选即按顺序加入，取消即移除；
// 批量操作（全选/清空）时重建或清空。allowed 下拉触发时 pool 无变化，函数直接返回。
function onPoolChanged(model, checked) {
  if (document.getElementById('eAutoMode').value !== 'priority') return;
  if (model) {
    if (checked && !autoPriority.includes(model)) autoPriority.push(model);
    if (!checked) autoPriority = autoPriority.filter(m => m !== model);
  } else if (checked) {
    enabledModels.forEach(m => { if (autoPoolSel.has(m) && !autoPriority.includes(m)) autoPriority.push(m); });
  } else {
    autoPriority = autoPriority.filter(m => autoPoolSel.has(m));
  }
  renderPrio();
}

function renderPrio() {
  const box = document.getElementById('prioList');
  if (!autoPriority.length) {
    box.innerHTML = '<span class="has-text-grey is-size-7">未单独排序，按候选池勾选顺序</span>';
    return;
  }
  box.innerHTML = autoPriority.map((m, i) => `
    <div data-pidx="${i}" style="display:flex;align-items:center;gap:.3rem;padding:.14rem 0">
      <span class="is-size-7 has-text-grey" style="width:1.8rem">${i + 1}.</span>
      <span class="mono is-size-7" style="flex:1;min-width:0;word-break:break-all">${esc(m)}</span>
      <button type="button" class="button is-small" data-pmove="-1" title="上移" ${i === 0 ? 'disabled' : ''}>↑</button>
      <button type="button" class="button is-small" data-pmove="1" title="下移" ${i === autoPriority.length - 1 ? 'disabled' : ''}>↓</button>
      <button type="button" class="button is-small is-danger is-light" data-pdel="${esc(m)}" title="从优先级移除">✕</button>
    </div>`).join('');
}
document.getElementById('prioList').addEventListener('click', e => {
  const mvBtn = e.target.closest('button[data-pmove]');
  const delBtn = e.target.closest('button[data-pdel]');
  if (mvBtn) {
    const i = +mvBtn.closest('[data-pidx]').dataset.pidx;
    const j = i + (+mvBtn.dataset.pmove);
    if (j < 0 || j >= autoPriority.length) return;
    [autoPriority[i], autoPriority[j]] = [autoPriority[j], autoPriority[i]];
    renderPrio();
  } else if (delBtn) {
    autoPriority = autoPriority.filter(m => m !== delBtn.dataset.pdel);
    renderPrio();
  }
});
document.getElementById('prioRebuild').addEventListener('click', () => {
  autoPriority = [...autoPoolSel].filter(m => enabledModels.includes(m))
    .concat([...autoPoolSel].filter(m => !enabledModels.includes(m)));
  renderPrio();
});

// 拉取渠道列表，计算启用模型并集（disabled 的不进下拉）
async function loadEnabledModels() {
  try {
    const chans = await api('/api/admin/channels');
    const set = new Set();
    chans.forEach(c => (c.models || []).forEach(m => set.add(m)));
    enabledModels = [...set].sort();
  } catch (_) { enabledModels = []; }
  ddAllowed.bind();
  ddAuto.bind();
}

// syncAutoBoxes 按所选模式显隐候选池/优先级配置
function syncAutoBoxes() {
  const mode = document.getElementById('eAutoMode').value;
  document.getElementById('autoModelsBox').style.display = mode ? 'block' : 'none';
  document.getElementById('autoPrioBox').style.display = mode === 'priority' ? 'block' : 'none';
}
document.getElementById('eAutoMode').addEventListener('change', e => {
  syncAutoBoxes();
  if (e.target.value === 'priority' && !autoPriority.length) {
    autoPriority = [...autoPoolSel]; // 首次切到优先级：以当前勾选顺序为初值
    renderPrio();
  }
});

window.openEditKey = function (id) {
  const k = keysCache.find(x => x.id === id);
  if (!k) return;
  editingKeyId = id;
  document.getElementById('eName').value = k.name;
  selectedModels.clear();        // 原地更新：下拉组件闭包持有同一个 Set 引用
  (k.allowed_models || []).forEach(m => selectedModels.add(m));
  ddAllowed.render('');
  ddAllowed.refreshLabel();
  autoPoolSel.clear();
  (k.auto_models || []).forEach(m => autoPoolSel.add(m));
  autoPriority = [...(k.auto_priority || [])];
  ddAuto.render('');
  ddAuto.refreshLabel();
  document.getElementById('eAutoMode').value = k.auto_mode || '';
  syncAutoBoxes();
  renderPrio();
  document.getElementById('eRpm').value = k.rpm_limit || 0;
  document.getElementById('eTpm').value = k.tpm_limit || 0;
  document.getElementById('eBudget').value = k.budget_usd || 0;
  document.getElementById('eBudgetTok').value = k.budget_tokens || 0;
  document.getElementById('eBudgetPeriod').value = k.budget_period === 'monthly' ? 'monthly' : 'daily';
  document.getElementById('eExpires').value = k.expires_at || '';
  document.getElementById('eErr').textContent = '';
  document.getElementById('editModal').classList.add('is-active');
};
function closeEdit() { document.getElementById('editModal').classList.remove('is-active'); }
document.getElementById('eClose').addEventListener('click', closeEdit);
document.getElementById('eCancel').addEventListener('click', closeEdit);
document.querySelector('#editModal .modal-background').addEventListener('click', closeEdit);
document.getElementById('eSave').addEventListener('click', async () => {
  const name = document.getElementById('eName').value.trim();
  if (!name) { document.getElementById('eErr').textContent = '名称不能为空'; return; }
  const models = [...selectedModels];
  const autoMode = document.getElementById('eAutoMode').value;
  try {
    await api('/api/admin/keys/' + editingKeyId, {
      method: 'PUT',
      body: JSON.stringify({
        name,
        allowed_models: models,
        rpm_limit: parseInt(document.getElementById('eRpm').value, 10) || 0,
        tpm_limit: parseInt(document.getElementById('eTpm').value, 10) || 0,
        budget_usd: parseFloat(document.getElementById('eBudget').value) || 0,
        budget_tokens: parseInt(document.getElementById('eBudgetTok').value, 10) || 0,
        budget_period: document.getElementById('eBudgetPeriod').value,
        expires_at: document.getElementById('eExpires').value,
        auto_mode: autoMode,
        auto_models: [...autoPoolSel],
        auto_priority: autoMode === 'priority' ? autoPriority.filter(m => autoPoolSel.has(m)) : [],
      }),
    });
    closeEdit(); toast('已保存'); load();
  } catch (ex) { document.getElementById('eErr').textContent = ex.message; }
});

load();
loadEnabledModels();
</script>
</body>
</html>
