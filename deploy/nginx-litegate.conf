# LiteGate 网关(https 29007 -> 127.0.0.1:8080)
# 2026-09-11: SSO 改为应用层——面板登录页支持"管理密码"与"SSO 登录"两种方式,
# SSO 已登录则自动换取面板会话直达(LiteGate 后端 /api/admin/sso-login 向本机
# sso 服务 /verify 转发 Cookie 验证)。nginx 层不再整站强制,避免挡住登录页自身。
# /v1 API 与 /healthz 与先前一致:API Key 认证,与 SSO 无关。
server {
    listen 29007 ssl;
    server_name 192.168.5.15;

    # 明文 http 请求打到 ssl 端口时(如导航页的 http:// 链接)自动 301 到 https
    error_page 497 =301 https://$host:$server_port$request_uri;

    ssl_certificate /etc/nginx/ssl/litegate.crt;
    ssl_certificate_key /etc/nginx/ssl/litegate.key;

    client_max_body_size 20M;

    # LLM API:API Key 认证。SSE 流式必须关缓冲,长超时给慢模型
    location /v1/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
    }

    # 探活端点保持公开(监控/状态徽章用)
    location = /healthz {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }

    # 管理面板:登录页自带管理密码/SSO 双方式,认证在 LiteGate 应用层
    # Host 用 $http_host(带端口),SSO 登录后回跳才不会丢 29007
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
    }
}
